name: Build Android APK
# Re-run CI against the latest inventory/storekeeper implementation and its documented acceptance criteria.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'docs/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main, 'feature/inventory-storekeeper-module']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: flutter create --platforms=android --org com.naeemsoft .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naeemsoft-restaurant-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
